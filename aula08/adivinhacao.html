<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container">
        <h1>Jogo de adivinhação</h1>
        <p>Adivinhe o número secreto entre 1 e 100.</p>
    
        <label for="numero">Seu palpite</label>
        <input type="number" id="numero" min="1" max="100" step="1" required>

        <label for="tentativas">Quantidade de tentativas</label>
        <input type="number" id="tentativas" value="10" min="1" max="100" step="1" readonly>
        
        <button id="sortear" type="button">Adivinhar</button>

        <p id="resultado" class="resultado" aria-live="polite">O resultado aparece aqui.</p>
    </main>
    <script src="js/adivinhacao.js"></script>
</body>
</html>
